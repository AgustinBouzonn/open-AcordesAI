services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: acordesai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: acordesai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acordesai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      DATABASE_URL: postgres://acordesai:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/acordesai
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "3003:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - default
      - easypanel-webpage
      - easypanel
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.acordesai-http.rule=Host(`acordesai.bthings.com.ar`)"
      - "traefik.http.routers.acordesai-http.entrypoints=http"
      - "traefik.http.routers.acordesai-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.acordesai.rule=Host(`acordesai.bthings.com.ar`)"
      - "traefik.http.routers.acordesai.entrypoints=https"
      - "traefik.http.routers.acordesai.tls=true"
      - "traefik.http.routers.acordesai.tls.certresolver=letsencrypt"
      - "traefik.http.services.acordesai.loadbalancer.server.port=80"

networks:
  easypanel-webpage:
    external: true
  easypanel:
    external: true

volumes:
  postgres_data:
