name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    # Fijado: ubuntu-latest pasó a 26.04 y Playwright 1.56 no instala Chromium ahí.
    # Subir junto con @playwright/test cuando lo soporte.
    runs-on: ubuntu-24.04
    services:
      # Misma versión que producción (docker-compose.yml). Coincide con DATABASE_URL de abajo.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      JWT_SECRET: test-secret-with-at-least-32-chars
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      # puppeteer es devDependency solo para scripts de import: los tests no necesitan Chromium.
      - name: Install backend deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: npm --prefix backend ci

      # oxlint cubre frontend, backend, scripts y tests (.oxlintrc.json). Errores cortan; avisos no.
      - name: Lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test:run

      - name: Build frontend and backend
        run: npm run build:all

      - name: Backend tests
        run: npm --prefix backend test

      # El deploy corre todas las migraciones en cada release: dos pasadas prueban que son idempotentes.
      - name: Migrations (twice, must be idempotent)
        env:
          PGPASSWORD: test
          PGOPTIONS: --client-min-messages=warning
        run: |
          for pass in 1 2; do
            for m in backend/migrations/*.sql; do
              psql -h localhost -U test -d test -v ON_ERROR_STOP=1 -q -f "$m"
            done
          done

      - name: Backend integration tests (Postgres)
        run: npm --prefix backend run test:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Smoke e2e contra la app real (backend compilado + vite preview + Postgres de arriba).
      - name: E2E smoke (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # El mismo build que corre Vercel (vercel.json → install, build y la función de /api): si la config
  # o el empaquetado de la función se rompen, falla acá y no en el deploy de producción.
  vercel-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Proyecto ficticio: `vercel build` no necesita cuenta, solo la config local.
      - name: vercel build
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_ci","orgId":"team_ci","settings":{"framework":"vite","nodeVersion":"22.x"}}' > .vercel/project.json
          npx --yes vercel@62.0.0 build --yes

      # La función empaquetada tiene que cargar sola, con las dependencias que trazó Vercel.
      - name: Function bundle loads
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          JWT_SECRET: test-secret-with-at-least-32-chars
        run: |
          node -e "import('./.vercel/output/functions/api/index.func/api/index.js').then((m) => {
            let h = m; for (let i = 0; i < 5; i++) if (h.default) h = h.default;
            if (typeof h !== 'function') throw new Error('api/index.js no exporta un handler');
            console.log('ok: handler', h.name || 'express');
          })"
