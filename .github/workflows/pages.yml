name: Landing (GitHub Pages)

# Publica la landing en https://agustinbouzonn.github.io/open-AcordesAI/ (gratis en repos públicos).
# Requiere una vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Se rearma en cada push a main (Novedades sale de los PRs mergeados) y en cada release
# (el botón del APK apunta al último GitHub Release). Ver scripts/build-landing.mjs.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      # Con dominio propio configurado en Pages, base_url pasa a ser ese dominio (canonical y sitemap).
      - name: Armar sitio
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-landing.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
