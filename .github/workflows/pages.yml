name: Landing (GitHub Pages)

# Publica landing/ en https://agustinbouzonn.github.io/open-AcordesAI/ (gratis en repos públicos).
# Requiere una vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'docs/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Las capturas e íconos se copian desde donde ya viven para no duplicarlos en el repo.
      - name: Armar sitio
        run: |
          mkdir -p _site/assets
          cp -r landing/. _site/
          cp docs/screenshots/*.png _site/assets/
          cp public/pwa-192x192.png public/apple-touch-icon.png _site/assets/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
