name: Deploy

# Despliega a producción cuando CI pasa en un push a main (o a mano).
# Secrets requeridos: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR.
# Opcional: VPS_KNOWN_HOSTS (salida de `ssh-keyscan <host>`), VPS_PORT.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://acordesai.bthings.com.ar
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
    steps:
      - name: Check secrets
        id: cfg
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_APP_DIR" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning::Faltan secrets VPS_*; se omite el deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Setup SSH
        if: steps.cfg.outputs.skip != 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Deploy on VPS
        if: steps.cfg.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$VPS_APP_DIR' bash -s -- '$SHA'" < scripts/deploy.sh

      - name: Public health check
        if: steps.cfg.outputs.skip != 'true'
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors \
            https://acordesai.bthings.com.ar/api/health
