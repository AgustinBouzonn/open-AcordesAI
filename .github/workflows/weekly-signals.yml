name: Weekly signals

# Cada lunes junta las señales de producto de producción (scripts/signals-report.sh)
# y abre un issue con el resumen. Es el input del loop de mejora.
# Secrets: los mismos del deploy (VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR).
# Opcional: variable de repo SIGNALS_AUTO_CLAUDE=true + secret CLAUDE_CODE_OAUTH_TOKEN
# (o ANTHROPIC_API_KEY) para que Claude tome el issue y abra PRs solo.
on:
  schedule:
    - cron: '7 12 * * 1' # lunes 09:07 hora de Buenos Aires
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.issue.outputs.number }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
    steps:
      - name: Check secrets
        id: cfg
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_APP_DIR" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning::Faltan secrets VPS_*; no hay reporte."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Setup SSH
        if: steps.cfg.outputs.skip != 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Build report on VPS
        if: steps.cfg.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$VPS_APP_DIR' DAYS=7 bash -s" < scripts/signals-report.sh > report.md
          head -c 400 report.md

      - name: Open issue
        id: issue
        if: steps.cfg.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -qx 'NO_EVENTS' report.md; then
            echo "Sin eventos esta semana; no se abre issue."
            exit 0
          fi
          gh label create signals --color 5319e7 --description "Reporte semanal de señales de producto" --force
          url=$(gh issue create --title "Señales de producto: semana del $(date -u +%F)" --body-file report.md --label signals)
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "Issue: $url"

  # Opcional: Claude toma el issue y abre PRs. Un issue creado con GITHUB_TOKEN no dispara
  # claude.yml, por eso se invoca acá directamente.
  improve:
    needs: report
    if: needs.report.outputs.issue != '' && vars.SIGNALS_AUTO_CLAUDE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Claude Code on the report
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Leé el issue #${{ needs.report.outputs.issue }} de este repo (reporte semanal de señales de producto)
            y seguí las instrucciones de su sección "Para el agente". Respetá CLAUDE.md.
            Como máximo 2 PRs, cada uno con test de regresión y referenciando el issue.
            Si nada justifica un cambio, comentá en el issue por qué y no abras PRs.
