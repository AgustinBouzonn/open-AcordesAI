# Actualizaciones de dependencias semanales, agrupadas para no generar un PR por paquete.
# Cada PR corre el CI completo (incluye Postgres e integración); se mergean a mano.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      frontend-minor:
        update-types: [minor, patch]
    # @types/node sigue la versión mayor de Node en producción (node:22 en Dockerfile y CI).
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      backend-minor:
        update-types: [minor, patch]
    # @types/node sigue la versión mayor de Node en producción (node:22 en Dockerfile y CI).
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
