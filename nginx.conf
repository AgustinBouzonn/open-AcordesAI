events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        resolver 127.0.0.11 valid=30s ipv6=off;

        # IP real del cliente: Cloudflare la manda en CF-Connecting-IP y Traefik llega por la red Docker.
        # Sin esto todos los requests salen con la IP de Traefik y el rate limit es uno solo para todos.
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header CF-Connecting-IP;

        # Headers de seguridad. add_header no se hereda en locations que definen el suyo: repetir ahí.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1000;

        # El service worker y el HTML tienen nombre fijo: si se cachean, la PWA no ve los deploys nuevos.
        location ~ ^/(sw\.js|workbox\.js|index\.html|manifest\.webmanifest)$ {
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        }

        location /api/ {
            set $backend_upstream "open-acordesai-backend-1:3001";
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            # $remote_addr ya es la IP del cliente (real_ip). Se reemplaza, no se agrega: Express (trust proxy 1)
            # toma el último valor y un X-Forwarded-For inventado por el cliente no debe llegar.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
